
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:      #F6F3F0;               /* headlines / heading      */
    --muted:    #9a9a94;               /* dates                    */
    --body:     #cfcfca;               /* story summary            */
    --hairline: rgba(255,255,255,0.14);/* dividers                 */
    --card:     rgba(255,255,255,0.12);/* card border, matches site*/
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    background: transparent;   /* lets the black page show through */
    color: var(--ink);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The card — same bordered, rounded, padded look as FEATURED / THE LATEST */
  .card{
    border: 1px solid var(--card);
    border-radius: 12px;
    padding: 24px;
  }

  /* Section heading, matching FEATURED / THE LATEST */
  .eyebrow{
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 22px;          /* a touch under the site's 24px so it fits the narrow column */
    line-height: 1.1;
    letter-spacing: 0;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .rule{ height: 1px; background: var(--hairline); margin-bottom: 2px; }

  .feed{ list-style: none; margin: 0; padding: 0; }

  .item{
    padding: 18px 0;
    border-bottom: 1px solid var(--hairline);
    opacity: 0;
    transform: translateY(6px);
    animation: rise .45s ease forwards;
  }
  .item:last-child{ border-bottom: 0; padding-bottom: 0; }

  @keyframes rise{ to{ opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce){
    .item{ opacity: 1; transform: none; animation: none; }
  }

  .date{
    font-family: 'Archivo', sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .headline{
    display: inline-block;
    font-family: 'Archivo Black', sans-serif;
    text-transform: uppercase;
    font-size: 17px;
    line-height: 1.2;
    letter-spacing: 0;
    color: var(--ink);
    text-decoration: none;
    margin: 0 0 8px;
    transition: color .15s ease;
  }
  .headline:hover,
  .headline:focus-visible{ color: #D73D40; }   /* National Account red on hover */
  .headline:focus-visible{ outline: 2px solid #D73D40; outline-offset: 3px; }

  .summary{
    font-family: 'Archivo', sans-serif;
    font-size: 14px;
    line-height: 1.45;
    color: var(--body);
    margin: 0 0 12px;
  }

  .tag{
    display: inline-block;
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 5px;
  }

  .state{ font-family: 'Archivo', sans-serif; color: var(--muted); font-size: 14px; padding: 8px 0 4px; }
</style>
</head>
<body>
  <div class="card">
    <!-- Change these words to rename the column -->
    <h2 class="eyebrow">The Network</h2>
    <div class="rule"></div>

    <ul class="feed" id="feed" aria-live="polite">
      <li class="state" id="state">Loading the network&hellip;</li>
    </ul>
  </div>

<script>
  const OPEN_IN = '_blank';   // open articles in a new tab

  const feedEl  = document.getElementById('feed');
  const stateEl = document.getElementById('state');

  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return '';
    // "Aug 13, 2026" — matches the site's date style
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Black or white tag text depending on how light the tag colour is.
  function textOn(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? '#1B180B' : '#ffffff';
  }

  function esc(s){
    return (s || '').replace(/[&<>"]/g, ch => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]
    ));
  }

  // Tell the parent page how tall we are, so the embed grows to fit
  // exactly and never cuts a story off.
  function postHeight(){
    const h = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if(window.parent){ window.parent.postMessage({ __networkFeedHeight: h }, '*'); }
  }

  fetch('/.netlify/functions/feed')
    .then(r => r.json())
    .then(data => {
      const items = (data && data.items) || [];
      if(!items.length){ stateEl.textContent = 'No stories yet.'; postHeight(); return; }

      feedEl.innerHTML = items.map(it => {
        const date    = fmtDate(it.date);
        const tagText = textOn(it.color || '#333');
        const summary = it.snippet ? `<p class="summary">${esc(it.snippet)}</p>` : '';
        return `
          <li class="item">
            ${date ? `<div class="date">${esc(date)}</div>` : ''}
            <a class="headline" href="${esc(it.link)}" target="${OPEN_IN}" rel="noopener">${esc(it.title)}</a>
            ${summary}
            <span class="tag" style="background:${esc(it.color)};color:${tagText}">${esc(it.masthead)}</span>
          </li>`;
      }).join('');

      postHeight();
    })
    .catch(() => {
      stateEl.textContent = "Couldn't load the network feed right now. Refresh to try again.";
      postHeight();
    });

  // Re-measure after fonts load and if the window changes size.
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(postHeight); }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
</script>
</body>
</html>
