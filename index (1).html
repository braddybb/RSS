<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---- The one line you might want to change: the heading text ---- */
  /* (find <h2 class="eyebrow"> further down and edit the words there) */

  :root{
    --ink:      #F6F3F0;  /* headlines / main text  */
    --muted:    #9a9a94;  /* dates, quiet text      */
    --body:     #c8c8c2;  /* story summary text     */
    --accent:   #D73D40;  /* National Account red   */
    --hairline: rgba(255,255,255,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    background: transparent;   /* lets the black page behind show through */
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ padding: 4px 2px 24px; max-width: 460px; }

  /* Section heading, echoing FEATURED / THE LATEST on the site */
  .eyebrow{
    font-family: "Oswald", sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 22px;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .rule{
    height: 2px;
    background: var(--hairline);
    position: relative;
    margin-bottom: 8px;
  }
  .rule::before{  /* short red accent under the heading */
    content: "";
    position: absolute;
    left: 0; top: 0;
    width: 44px; height: 2px;
    background: var(--accent);
  }

  .feed{ list-style: none; margin: 0; padding: 0; }

  .item{
    padding: 20px 0;
    border-bottom: 1px solid var(--hairline);
    opacity: 0;
    transform: translateY(6px);
    animation: rise .45s ease forwards;
  }
  .item:last-child{ border-bottom: 0; }

  @keyframes rise{ to{ opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce){
    .item{ opacity: 1; transform: none; animation: none; }
  }

  .date{
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }

  .headline{
    display: inline-block;
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 18px;
    line-height: 1.2;
    color: var(--ink);
    text-decoration: none;
    margin: 0 0 8px;
    transition: color .15s ease;
  }
  .headline:hover,
  .headline:focus-visible{ color: var(--accent); }
  .headline:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .summary{
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--body);
    margin: 0 0 12px;
  }

  .tag{
    display: inline-block;
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 4px;
  }

  .state{ color: var(--muted); font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Change these words to rename the column -->
    <h2 class="eyebrow">The Network</h2>
    <div class="rule"></div>

    <ul class="feed" id="feed" aria-live="polite">
      <li class="state" id="state">Loading the network&hellip;</li>
    </ul>
  </div>

<script>
  // Where to open articles: '_blank' = new tab (keeps readers on your page).
  const OPEN_IN = '_blank';

  const feedEl  = document.getElementById('feed');
  const stateEl = document.getElementById('state');

  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return '';
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // Pick black or white tag text depending on how light the tag colour is.
  function textOn(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? '#1B180B' : '#ffffff';
  }

  function esc(s){
    return (s || '').replace(/[&<>"]/g, ch => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]
    ));
  }

  fetch('/.netlify/functions/feed')
    .then(r => r.json())
    .then(data => {
      const items = (data && data.items) || [];
      if(!items.length){ stateEl.textContent = 'No stories yet.'; return; }

      feedEl.innerHTML = items.map(it => {
        const date    = fmtDate(it.date);
        const tagText = textOn(it.color || '#333');
        const summary = it.snippet ? `<p class="summary">${esc(it.snippet)}</p>` : '';
        return `
          <li class="item">
            ${date ? `<div class="date">${esc(date)}</div>` : ''}
            <a class="headline" href="${esc(it.link)}" target="${OPEN_IN}" rel="noopener">${esc(it.title)}</a>
            ${summary}
            <span class="tag" style="background:${esc(it.color)};color:${tagText}">${esc(it.masthead)}</span>
          </li>`;
      }).join('');
    })
    .catch(() => {
      stateEl.textContent = "Couldn't load the network feed right now. Refresh to try again.";
    });
</script>
</body>
</html>
